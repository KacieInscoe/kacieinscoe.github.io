<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Market Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Crypto Market Explorer</h1>
        <div class="controls">
            <button id="fetch-btn">Load Top Cryptos</button>
            <input type="text" id="search-input" placeholder="Search crypto...">
            <button id="search-btn">Search</button>
        </div>
        <div id="error-message" class="error"></div>
        <div id="crypto-grid"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
